# Open Beam configuration. Copy to beam.toml and edit.
#
# File paths are relative to this file. Open Beam reads only the data files
# listed here, and never changes them.

# Address to listen on. The default is reachable from this computer only.
bind = "127.0.0.1:8787"

# Largest number of rows returned per feed response. Clients follow next-page
# links automatically, so this bounds memory use, not the size of a dataset.
max_page_size = 5000

# Where accounts are kept. The file is created on first run and belongs to
# you: it is never part of this project and is ignored by Git.
accounts = "beam-accounts.sqlite"

# Set when Open Beam is published through an HTTPS reverse proxy.
# public_url = "https://beam.example.org"

# Longest a single query may run before it is cancelled, in seconds (1-3600).
# query_timeout_seconds = 30

# Read-only access for PostgreSQL tools such as psql or DBeaver. Off unless
# set. Sign in with your username and a personal API token from Settings.
# The connection is not encrypted, so keep it on this computer.
# postgres_bind = "127.0.0.1:5433"

# A dataset from a CSV or Parquet file.
[[dataset]]
name = "sales"
path = "examples/sales.csv"
# A column whose values are unique and never empty. Optional: without it,
# Open Beam adds a `_row` number column to act as the key.
key = "order_id"

# A dataset computed from datasets declared above it. See
# docs/guides/04-combine-and-clean-data.md.
[[dataset]]
name = "sales_by_region"
key = "region"
sql = """
SELECT region,
       sum(units)              AS units,
       sum(units * unit_price) AS revenue
FROM sales
GROUP BY region
"""
