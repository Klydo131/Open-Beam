[workspace]
resolver = "2"
members = ["crates/beam-engine", "crates/beam-odata", "crates/beam-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Klydo131/Open-Beam"

[workspace.dependencies]
beam-engine = { path = "crates/beam-engine" }
beam-odata = { path = "crates/beam-odata" }
duckdb = { version = "1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
