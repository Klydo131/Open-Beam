<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 626" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Open Beam architecture</title>
  <desc id="d">People use Open Beam in a browser, and Excel and Power BI read from it over OData. Open Beam has four parts, server, accounts, protocol and engine, and reads your files without changing them.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5B6B82"/></marker>
  </defs>
  <rect width="960" height="626" rx="20" fill="#FFFFFF" stroke="#D5DCE6"/>

  <g font-size="18" font-weight="600" fill="#0B1F3A" text-anchor="middle">
    <rect x="150" y="36" width="190" height="60" rx="12" fill="#EEF3F9" stroke="#C4CFDD"/><text x="245" y="73">Your browser</text>
    <rect x="385" y="36" width="190" height="60" rx="12" fill="#EEF3F9" stroke="#C4CFDD"/><text x="480" y="73">Excel</text>
    <rect x="620" y="36" width="190" height="60" rx="12" fill="#EEF3F9" stroke="#C4CFDD"/><text x="715" y="73">Power BI</text>
  </g>

  <line x1="480" y1="100" x2="480" y2="156" stroke="#5B6B82" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="496" y="134" font-size="15" fill="#5B6B82">web pages and data feed, read-only</text>

  <rect x="110" y="160" width="740" height="328" rx="18" fill="#0B1F3A"/>
  <text x="140" y="196" font-size="18" font-weight="700" fill="#FFFFFF">Open Beam</text>
  <text x="820" y="196" font-size="14" fill="#B8C7DC" text-anchor="end">one program, on your machine</text>

  <g font-size="17">
    <rect x="140" y="212" width="680" height="56" rx="10" fill="#FFB627"/>
    <text x="160" y="246" font-weight="700" fill="#0B1F3A">Server</text>
    <text x="800" y="246" fill="#0B1F3A" text-anchor="end">web pages, data feed, settings</text>

    <rect x="140" y="278" width="680" height="56" rx="10" fill="#F4A6B4"/>
    <text x="160" y="312" font-weight="700" fill="#0B1F3A">Accounts</text>
    <text x="800" y="312" fill="#0B1F3A" text-anchor="end">who may sign in, kept in a file you own</text>

    <rect x="140" y="344" width="680" height="56" rx="10" fill="#2EC4B6"/>
    <text x="160" y="378" font-weight="700" fill="#0B1F3A">Protocol</text>
    <text x="800" y="378" fill="#0B1F3A" text-anchor="end">turns each request into a safe query</text>

    <rect x="140" y="410" width="680" height="56" rx="10" fill="#5BC0EB"/>
    <text x="160" y="444" font-weight="700" fill="#0B1F3A">Engine</text>
    <text x="800" y="444" fill="#0B1F3A" text-anchor="end">runs queries, sealed to your listed files</text>
  </g>

  <line x1="480" y1="492" x2="480" y2="534" stroke="#5B6B82" stroke-width="2" marker-start="url(#a)"/>
  <text x="496" y="519" font-size="15" fill="#5B6B82">reads, never writes</text>

  <rect x="290" y="538" width="380" height="60" rx="12" fill="#EEF3F9" stroke="#C4CFDD"/>
  <text x="480" y="575" font-size="18" font-weight="600" fill="#0B1F3A" text-anchor="middle">Your files: CSV, Parquet</text>
</svg>
