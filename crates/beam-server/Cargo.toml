[package]
name = "beam-server"
description = "The `beam` binary: serves Open Beam datasets to Excel, Power BI and other clients."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "beam"
path = "src/main.rs"

[dependencies]
beam-accounts.workspace = true
beam-engine.workspace = true
beam-odata.workspace = true
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde.workspace = true
serde_json.workspace = true
toml = "0.9"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
subtle = "2"
form_urlencoded = "1"
maud = "0.27"
calamine = "0.38"
zip = { version = "9", default-features = false }
getrandom = "0.4"
rust_xlsxwriter = { version = "0.102", default-features = false }
sha2 = "0.11"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[lints]
workspace = true
