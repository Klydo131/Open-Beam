[package]
name = "beam-server"
description = "The `beam` binary: serves Open Beam datasets to Excel, Power BI and other clients."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "beam"
path = "src/main.rs"

[dependencies]
beam-engine.workspace = true
beam-odata.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde.workspace = true
serde_json.workspace = true
toml = "0.9"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
subtle = "2"
form_urlencoded = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[lints]
workspace = true
